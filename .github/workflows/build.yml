name: Build Livai
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create game
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!DOCTYPE html><html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
          <style>
          *{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
          body{margin:0;background:#000;overflow:hidden;font-family:monospace}
          canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
          .b{position:fixed;width:62px;height:62px;border-radius:50%;background:#ffffff22;border:2px solid #fff6;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
          #bl{left:14px;bottom:20px}#br{left:96px;bottom:20px}#bu{left:55px;bottom:92px}
          #bj{right:20px;bottom:30px;width:76px;height:76px;background:#c0202055}
          #bk{right:106px;bottom:20px;background:#fff4}#bp{right:20px;bottom:116px;background:#2c8a4a66}#bd{right:106px;bottom:92px}
          </style></head><body>
          <canvas id="c" width="480" height="270"></canvas>
          <div class="b" id="bl" data-k="a">◀</div><div class="b" id="br" data-k="d">▶</div><div class="b" id="bu" data-k="w">▲</div>
          <div class="b" id="bj" data-k="j">⚔</div><div class="b" id="bk" data-k="k">✦</div><div class="b" id="bp" data-k="l">🧪</div><div class="b" id="bd" data-k="s">≫</div>
          <script src="g.js"></script>
          </body></html>
          EOF
          cat > www/g.js <<'EOF'
          // ===== PART 1: CORE ENGINE + STAGE 1 =====
          var cv=document.getElementById('c'),X=cv.getContext('2d'),W=480,H=270,GY=222;X.imageSmoothingEnabled=false;
          var Q={snd:1,dif:1},DM=function(){return[.6,1,1.5][Q.dif]};
          // ---- audio (Web Audio, no files) ----
          var AC;function snd(f,d,t,v,s){if(!Q.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,AC.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(30,f+(s||0)),AC.currentTime+d);g.gain.setValueAtTime(v||.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
          var S={sword:function(){snd(900,.12,'sawtooth',.1,-600)},hit:function(){snd(160,.15,'square',.15,-100)},boom:function(){snd(70,.6,'sawtooth',.25,-40)},heal:function(){snd(500,.3,'sine',.12,500)},light:function(){snd(300,.7,'triangle',.2,1200)},hurt:function(){snd(120,.25,'sawtooth',.15,-60)},tick:function(){snd(700,.03,'square',.04)},jump:function(){snd(300,.15,'sine',.06,300)}};
          // ---- pixel sprite maker: rows of chars -> canvas ----
          function mk(rows,pal,sc,flip){var c=document.createElement('canvas');c.width=rows[0].length*sc;c.height=rows.length*sc;var g=c.getContext('2d');rows.forEach(function(r,y){for(var x=0;x<r.length;x++){var ch=r[x];if(pal[ch]){g.fillStyle=pal[ch];g.fillRect((flip?r.length-1-x:x)*sc,y*sc,sc,sc)}}});return c}
          var rev=function(a){return a.map(function(r){return r.split('').reverse().join('')})};
          var LP={h:'#f4f4fa',s:'#e9c9a6',a:'#fff',g:'#9aa6bf',b:'#1b1b25',k:'#2a2a3c',y:'#d9b24c'};
          var HEAD=["....hhhhhh....","...hhhhhhhh...","..hhhhhhhhhh..","..hhsssssshh..","..hhsbssbshh..","..hh.ssss.hh..","...hgaaaagh...","..ggaaaaaagg..",".kgaayyyyaagk.",".kgaaaaaaaagk.",".kgaaggggaagk.","..gaaaaaaaag..","..yyyyyyyyyy..","..kkaaaaaakk.."];
          var LEGS={st:["..kkk....kkk..","..kgk....kgk..","..kgk....kgk..","..kkk....kkk..","..bbb....bbb..",".bbbb....bbbb."],wa:["...kkk..kkk...","..kgk....kgk..",".kgk......kgk.",".kkk.......kk.","bbbb........bb","bbb..........b"]};
          var LV={};[['st',LEGS.st],['w1',LEGS.wa],['w2',rev(LEGS.wa)]].forEach(function(a){LV[a[0]]=[mk(HEAD.concat(a[1]),LP,3,0),mk(HEAD.concat(a[1]),LP,3,1)]});
          var SOLR=["...dddddd...","..dddddddd..","..drddddrd..","..dddmmddd..","...dddddd...",".mdddddddmd.","mmddmmmmddmm",".mddmmmmddm.","..dddddddd..","..dd....dd..","..dd....dd..","..dd....dd..",".mmm....mmm."];
          var SOP={d:'#15121a',r:'#ff2b2b',m:'#6b6b78'};
          // ---- registries: later parts add to these ----
          var EN={sol:{im:[mk(SOLR,SOP,3,0),mk(SOLR,SOP,3,1)],hp:30,w:34,h:39,spd:.9,dmg:6,cd:60,rng:30}};
          var PI={LEVI:LV.st[0]};
          var ST=[{name:'القرية الحدودية',waves:3,cols:['#1a0a0a','#3a1208','#6a2108','#a03a0a'],fire:1,
            dl:[{n:'LEVI',t:'القرية تحترق... جيش الجحيم وصل حدودنا.'},{n:'جندي الجحيم',t:'ثلاثة وثمانون ألف سيف ضد رجل واحد!'},{n:'LEVI',t:'إذن سأبدأ بالعدّ.'}],
            spawn:function(w){for(var i=0;i<4+w*2;i++)E.push(mkE('sol',W+30+i*55))}}];
          // ---- state ----
          var K={},G={sc:'menu',pt:0},P,E=[],PT=[],shake=0,flash=0,stage=0,wave=0,kills=0,tm=0,dlg=null,boss=null,stats={k:0,dmg:0,pots:0,t:0};
          function mkE(t,x){var d=EN[t];return{t:t,x:x,y:GY,hp:d.hp,mx:d.hp,w:d.w,h:d.h,cd:30+Math.random()*40,hit:0}}
          function newP(){P={x:80,y:GY,vx:0,vy:0,hp:100,mx:100,st:100,f:1,atk:0,inv:0,pot:3,sp:0,dash:0,fr:0,cmb:0,cw:0};kills=0;stats={k:0,dmg:0,pots:0,t:0}}
          function spawnWave(){wave++;ST[stage].spawn(wave)}
          function startStage(i){stage=i;E=[];PT=[];wave=0;boss=null;G.pt=0;(ST[i].init||spawnWave)();G.sc='play'}
          function talk(l,next){dlg={l:l,i:0,c:0,next:next};G.sc='dlg'}
          function nextStage(){stats.t=Math.round(G.pt/60);if(stage+1<ST.length)talk(ST[stage+1].dl,function(){startStage(stage+1)});else onEnd()}
          function onEnd(){G.sc='win'}
          function burst(x,y,col,n,sp){sp=sp||3;for(var i=0;i<n;i++)PT.push({x:x,y:y,vx:(Math.random()-.5)*sp*2,vy:-Math.random()*sp,l:20+Math.random()*20,c:col})}
          function useItem(n){if(n==0&&P.pot>0&&P.hp<P.mx){P.pot--;P.hp=Math.min(P.mx,P.hp+40);stats.pots++;S.heal();burst(P.x,P.y-30,'#4f4',14,1.5)}}
          // ---- input (keyboard + touch) ----
          var KM={ArrowLeft:'a',ArrowRight:'d',ArrowUp:'w'};
          addEventListener('keydown',function(e){K[KM[e.key]||e.key.toLowerCase()]=1;if(e.code==='Space')adv()});
          addEventListener('keyup',function(e){K[KM[e.key]||e.key.toLowerCase()]=0});
          document.querySelectorAll('.b').forEach(function(b){var k=b.dataset.k;b.addEventListener('touchstart',function(e){e.preventDefault();K[k]=1},{passive:false});['touchend','touchcancel'].forEach(function(t){b.addEventListener(t,function(e){e.preventDefault();K[k]=0})})});
          function adv(){if(G.sc==='dlg'&&dlg){var L=dlg.l[dlg.i];if(dlg.c<L.t.length)dlg.c=L.t.length;else if(++dlg.i>=dlg.l.length){G.sc='play';dlg.next&&dlg.next()}}}
          function ptr(e){var r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e,y=(t.clientY-r.top)/r.height*H;
            if(G.sc==='dlg')return adv();
            if(G.sc==='menu'){if(y>130&&y<158){newP();talk(ST[stage].dl,function(){startStage(stage)})}else if(y>166&&y<194){stage=(stage+1)%ST.length;G.msg='المرحلة '+(stage+1)+': '+ST[stage].name}else if(y>202&&y<230)G.sc='set'}
            else if(G.sc==='set'){if(y>100&&y<128)Q.snd^=1;else if(y>140&&y<168)Q.dif=(Q.dif+1)%3;else if(y>190&&y<218)G.sc='menu'}
            else if(G.sc==='over'||G.sc==='win')G.sc='menu'}
          cv.addEventListener('mousedown',ptr);cv.addEventListener('touchstart',function(e){e.preventDefault();ptr(e)},{passive:false});
          // ---- combat ----
          function hurt(e,d){e.hp-=d;stats.dmg+=d|0}
          function dmg(d){if(P.inv<=0&&Math.abs(P.y-GY)<40){P.hp-=d*DM();P.inv=30;S.hurt();shake=8;burst(P.x,P.y-30,'#a00',10);if(P.hp<=0){stats.t=Math.round(G.pt/60);G.sc='over'}}}
          function update(){
            G.pt++;P.fr++;if(P.cw>0)P.cw--;var sp=(K.a||K.d)?2.6:0;
            if(K.a){P.vx=-sp;P.f=-1}else if(K.d){P.vx=sp;P.f=1}else P.vx*=.7;
            if(P.dash>0){P.vx=P.f*7;P.dash--}
            if(K.s&&P.st>=30&&P.dash<=0){P.dash=10;P.st-=30;P.inv=Math.max(P.inv,14);K.s=0}
            if(K.w&&P.y>=GY){P.vy=-9;K.w=0;S.jump()}
            P.vy+=.55;P.y+=P.vy;if(P.y>GY){P.y=GY;P.vy=0}
            P.x=Math.max(10,Math.min(W-10,P.x+P.vx));P.st=Math.min(100,P.st+.35);if(P.inv>0)P.inv--;if(P.sp>0)P.sp--;
            if(K.j&&P.atk<=0&&P.st>=8){P.atk=18;P.st-=8;P.cmb=P.cw>0?P.cmb%3+1:1;P.cw=36;S.sword()}
            if(K.l){K.l=0;useItem(0)}
            if(K.k&&P.sp<=0){K.k=0;P.sp=420;flash=30;shake=25;S.light();E.forEach(function(e){hurt(e,70)})}
            if(P.atk>0){P.atk--;if(P.atk>=6&&P.atk<=12){var bx=P.f>0?P.x+14:P.x-62,m=P.cmb==3?1.6:1;E.forEach(function(e){if(e.hit<=0&&e.x+e.w/2>bx&&e.x-e.w/2<bx+48&&Math.abs(e.y-P.y)<60){hurt(e,(e.boss?12:15)*m);e.hit=14;e.x+=P.f*(e.boss?2:12);burst(e.x,e.y-30,'#c00',8);burst(e.x,e.y-30,'#fe8',4,4);S.hit();shake=Math.max(shake,4)}})}}
            E.forEach(function(e){var d=EN[e.t];if(e.hit>0)e.hit--;if(d.ai)return d.ai(e);
              var dx=P.x-e.x,ad=Math.abs(dx);e.cd--;
              if(ad>d.rng)e.x+=(dx>0?1:-1)*(d.spd+wave*.1);else if(e.cd<=0){e.cd=d.cd;dmg(d.dmg)}});
            E=E.filter(function(e){if(e.hp<=0){kills++;stats.k++;burst(e.x,e.y-30,'#fa0',e.boss?60:14,e.boss?6:3);S.boom();if(Math.random()<.3||e.boss)P.pot=Math.min(9,P.pot+1);return false}return true});
            if(!E.length&&G.sc==='play'){if(wave<ST[stage].waves)spawnWave();else nextStage()}
            PT.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.l--});PT=PT.filter(function(p){return p.l>0});
            if(ST[stage].fire&&tm%4==0)PT.push({x:Math.random()*W,y:GY-20,vx:0,vy:-1.5,l:60,c:'#f72',s:1})}
          // ---- drawing ----
          function bg(){var s=ST[stage];s.cols.forEach(function(c,i){X.fillStyle=c;X.fillRect(0,i*GY/4,W,GY/4+1)});
            var ox=(P?P.x*.1:0)|0;X.fillStyle='#e8e0d0';X.fillRect(380,30,22,22);X.fillStyle=s.cols[0];X.fillRect(386,30,16,16);
            if(s.bgfn)s.bgfn(ox);else for(var i=0;i<6;i++){var x=i*90-ox,h=50+(i*37%40);X.fillStyle='#120808';X.fillRect(x,GY-h,60,h);X.fillRect(x+10,GY-h-14,40,14);X.fillStyle='#ff9a2a';X.fillRect(x+14,GY-h+12,8,10);X.fillRect(x+36,GY-h+12,8,10)}
            X.fillStyle='#241a14';X.fillRect(0,GY,W,H-GY);X.fillStyle='#3a2a1e';for(var j=0;j<W;j+=12)X.fillRect(j,GY+14,6,3)}
          function drawP(){if(P.inv>0&&tm%4<2)return;var mv=Math.abs(P.vx)>1&&P.y>=GY,w=P.fr>>3&1,fr=P.y<GY?'st':mv?(w?'w1':'w2'):'st',im=LV[fr][P.f<0?1:0];
            X.drawImage(im,P.x-21,P.y-60+(mv&&w?-2:0));
            var a=P.atk>0?(-1.9+(18-P.atk)/18*3.4):-.6,ox=P.x+P.f*12,oy=P.y-32;
            for(var i=0;i<=14;i++){X.fillStyle=i<2?'#d9b24c':i>12?'#fff':'#bfe0ff';X.fillRect((ox+Math.cos(a)*i*3.4*P.f)|0,(oy+Math.sin(a)*i*3.4)|0,3,3)}
            if(P.atk>5&&P.atk<14){X.fillStyle='#ffffff99';for(var k=0;k<10;k++){var aa=-1.9+(18-P.atk)/18*3.4-k*.1;X.fillRect((ox+Math.cos(aa)*48*P.f)|0,(oy+Math.sin(aa)*48)|0,3,3)}}}
          function drawE(e){var d=EN[e.t],f=P.x<e.x?1:0;if(d.draw)return d.draw(e,f);var im=d.im[f];X.save();if(e.hit>0)X.globalAlpha=.6;X.drawImage(im,e.x-im.width/2,e.y-im.height);X.restore();
            if(!e.boss){X.fillStyle='#000';X.fillRect(e.x-14,e.y-46,28,4);X.fillStyle='#e22';X.fillRect(e.x-13,e.y-45,26*e.hp/e.mx,2)}}
          function txt(t,x,y,s,c,a){X.font='bold '+(s||10)+'px monospace';X.textAlign=a||'left';X.fillStyle='#000';X.fillText(t,x+1,y+1);X.fillStyle=c||'#fff';X.fillText(t,x,y)}
          function box(x,y,w,h,c){X.fillStyle=c||'#000c';X.fillRect(x,y,w,h);X.strokeStyle='#d9b24c';X.strokeRect(x+.5,y+.5,w-1,h-1)}
          function hud(){box(8,8,128,34);X.fillStyle='#400';X.fillRect(12,12,120,8);X.fillStyle='#e33';X.fillRect(12,12,120*Math.max(0,P.hp)/P.mx,8);X.fillStyle='#220';X.fillRect(12,24,120,5);X.fillStyle='#fc3';X.fillRect(12,24,120*P.st/100,5);
            txt('🧪 x'+P.pot+'   ✦ '+(P.sp>0?Math.ceil(P.sp/60)+'s':'جاهز'),12,38,8,'#cfc');
            txt('المرحلة '+(stage+1)+'  قتل: '+kills+(P.cmb>1&&P.cw>0?'  كومبو x'+P.cmb:''),W-8,18,9,'#fff','right')}
          function drawDlg(){var L=dlg.l[dlg.i];if(dlg.c<L.t.length&&tm%2==0){dlg.c++;S.tick()}
            box(0,H-86,W,86);box(10,H-124,70,70,'#111e');var im=PI[L.n]||EN.sol.im[0],sh=im.height*.45;X.drawImage(im,0,0,im.width,sh,14,H-120,62,Math.min(62,62*sh/im.width));
            txt(L.n,90,H-66,11,'#fc6');txt(L.t.slice(0,dlg.c),90,H-44,11);txt('▼ Space / لمس',W-10,H-8,8,'#aaa','right')}
          function menuBtns(a){a.forEach(function(b){box(W/2-80,b[1],160,28);txt(b[0],W/2,b[1]+19,12,'#fff','center')})}
          function loop(){X.clearRect(0,0,W,H);tm++;
            if(G.sc==='menu'){X.fillStyle='#07070d';X.fillRect(0,0,W,H);for(var i=0;i<5;i++){X.fillStyle='#14121c';X.fillRect(40+i*90,110-i%3*18,36,120);X.fillRect(30+i*90,96-i%3*18,16,16);X.fillRect(62+i*90,96-i%3*18,16,16)}
              X.fillStyle='#e8e0d0';X.fillRect(400,24,20,20);txt('LIVAI',W/2,60,34,'#fff','center');txt('SHADOWS OF HELL',W/2,82,13,'#d33','center');
              menuBtns([['بدء القصة',130],['اختر المرحلة ('+(stage+1)+')',166],['الإعدادات',202]]);if(G.msg)txt(G.msg,W/2,254,9,'#fc6','center');X.drawImage(LV.st[0],20,170)}
            else if(G.sc==='set'){X.fillStyle='#07070d';X.fillRect(0,0,W,H);txt('الإعدادات',W/2,60,20,'#fc6','center');menuBtns([['الصوت: '+(Q.snd?'تشغيل':'إيقاف'),100],['الصعوبة: '+['سهل','عادي','صعب'][Q.dif],140],['رجوع',190]])}
            else if(P){var sx=shake>0?(Math.random()-.5)*shake/3:0,sy=shake>0?(Math.random()-.5)*shake/3:0;if(shake>0)shake--;
              X.save();X.translate(sx,sy);bg();if(G.sc==='play')update();E.slice().sort(function(a,b){return a.y-b.y}).forEach(drawE);drawP();PT.forEach(function(p){X.fillStyle=p.c;X.fillRect(p.x|0,p.y|0,p.s?3:2,p.s?3:2)});X.restore();if(G.sc==='play')hud();
              if(flash>0){X.fillStyle='rgba(255,255,255,'+flash/30+')';X.fillRect(0,0,W,H);flash--}
              if(G.sc==='dlg')drawDlg();
              if(G.sc==='over'||G.sc==='win'){X.fillStyle='#000d';X.fillRect(0,0,W,H);txt(G.sc==='win'?'انتصار!':'GAME OVER',W/2,90,24,G.sc==='win'?'#fc6':'#e22','center');
                txt('الأعداء: '+stats.k+'   الضرر: '+stats.dmg,W/2,130,12,'#fff','center');txt('علاجات: '+stats.pots+'   الوقت: '+stats.t+'s',W/2,150,12,'#fff','center');txt('المس الشاشة للعودة',W/2,200,10,'#aaa','center')}}
            requestAnimationFrame(loop)}
          loop();
          EOF
          # ===== INSERT NEXT PART ABOVE THIS LINE =====
          npx cap init Livai com.livai.game --web-dir www
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Livai-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          cat >> www/g.js <<'EOF'
          // ===== PART 2: GRAPHICS & ANIMATION =====
          (function(){
          // --- new Levi frames: run (leaning), crouch, 3 full-body attack poses ---
          var lean=function(a){return a.map(function(r,i){return i<8?'.'+r.slice(0,13):r})};
          [['r1',LEGS.wa],['r2',rev(LEGS.wa)]].forEach(function(a){var rows=lean(HEAD).concat(a[1]);LV[a[0]]=[mk(rows,LP,3,0),mk(rows,LP,3,1)]});
          var crR=HEAD.concat(["..kkkkkkkkkk..",".bbbbkkkkbbbb."]);LV.cr=[mk(crR,LP,3,0),mk(crR,LP,3,1)];
          [8,9,11].forEach(function(row,i){var rows=HEAD.concat(LEGS.st).map(function(r,j){return j==row?r.slice(0,13)+'sssss':r+'....'});LV['a'+(i+1)]=[mk(rows,LP,3,0),mk(rows,LP,3,1)]});
          var AR=[[-2.3,.5],[-.3,.15],[1.1,-2.7]];
          // --- crouch button (touch) ---
          var cb=document.createElement('div');cb.className='b';cb.id='bx';cb.dataset.k='x';cb.textContent='⤓';cb.style.cssText='left:178px;bottom:20px';document.body.appendChild(cb);
          cb.addEventListener('touchstart',function(e){e.preventDefault();K.x=1},{passive:false});['touchend','touchcancel'].forEach(function(t){cb.addEventListener(t,function(e){e.preventDefault();K.x=0})});
          // --- update wrapper: crouch, run, dust, landing ---
          var _u=update;update=function(){
            var cr=!!(K.x||K.arrowdown)&&P.y>=GY&&P.atk<=0;P.cr=cr;var sa=K.a,sd=K.d;if(cr){K.a=0;K.d=0;P.vx=0}
            var pv=P.vy;_u();K.a=sa;K.d=sd;
            var mv=Math.abs(P.vx)>1&&P.y>=GY;P.rn=mv?(P.rn||0)+1:0;
            if(P.rn>40&&P.dash<=0)P.x=Math.max(10,Math.min(W-10,P.x+P.f*1.2));
            if(mv&&P.fr%5==0)PT.push({x:P.x-P.f*10,y:GY-2,vx:-P.f*.5,vy:-.4,l:16,c:'#8a7a6a',s:1});
